<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>페이지를 찾을 수 없습니다 | 오픈가든</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/assets/logo.svg" type="image/svg+xml">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;800&display=swap" rel="stylesheet">
<style>
:root{--green:#1F4D33;--green-dark:#123023;--ink:#111814;--gray:#6b746e;--line:#E4E8E3}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Noto Sans KR',sans-serif;color:var(--ink);min-height:100vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;background:#fff}
.code{font-size:15px;font-weight:800;color:#7FA05B;letter-spacing:.2em}
h1{font-size:clamp(24px,5vw,36px);font-weight:800;letter-spacing:-.03em;margin:14px 0 10px}
p{color:var(--gray);font-size:15.5px}
.actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:30px}
.btn{display:inline-block;padding:14px 30px;border-radius:999px;font-weight:700;font-size:15px;text-decoration:none;background:var(--green);color:#fff}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line)}
</style>
</head>
<body>
<div>
  <div class="code">404</div>
  <h1>이 페이지는 찾지 못했지만,<br>식물은 1,924종 있습니다</h1>
  <p>주소가 바뀌었거나 잘못 입력된 것 같아요.</p>
  <div class="actions">
    <a class="btn" href="/">홈으로</a>
    <a class="btn ghost" href="/catalog.html">카탈로그 보기</a>
  </div>
</div>
</body>
</html>
